<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Your TrackMade order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f1efea;--card:#fff;--ink:#1d2125;--muted:#6b7782;--line:#e2dfd8;--accent:#c8302a;--ok:#2f7a4f;--soft:#f7f6f3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:620px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
header img{height:38px}
h1,h2{font-family:Sora,system-ui,sans-serif;margin:0;line-height:1.2}
h1{font-size:24px}h2{font-size:18px;margin-bottom:10px}
.card{background:var(--card);border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 1px 0 var(--line)}
.pill{display:inline-block;font:600 13px Sora,sans-serif;padding:5px 11px;border-radius:99px;background:var(--soft);color:var(--ink)}
.pill.you{background:#fbe9e7;color:var(--accent)}
.steps{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:10px}
.steps li{display:flex;gap:12px;align-items:center;color:var(--muted)}
.steps li i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:600}
.steps li.done{color:var(--ink)}.steps li.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.now{color:var(--ink);font-weight:600}.steps li.now i{border-color:var(--accent);color:var(--accent)}
.preview img{width:100%;border-radius:12px;display:block;background:var(--soft)}
.note{background:var(--soft);border-radius:10px;padding:12px 14px;margin:12px 0}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button,.btn{font:600 16px Sora,sans-serif;border:0;border-radius:12px;padding:14px 18px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.primary{background:var(--accent);color:#fff;flex:1}
.ghost{background:var(--ink);color:#fff;flex:1}
button:disabled{opacity:.5;cursor:default}
textarea{width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;margin-top:10px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}dt{color:var(--muted)}dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.msg{border-left:4px solid var(--ok);background:var(--card);border-radius:10px;padding:12px 14px;margin:14px 0}
.msg.err{border-color:var(--accent)}
.muted{color:var(--muted);font-size:14px}
[hidden]{display:none!important}
</style>
<main>
  <header><a href="/"><img src="/email-logo.png" alt="TrackMade"></a><span class="muted" id="ref"></span></header>
  <div class="msg" id="banner" hidden></div>
  <div class="card" id="loading"><p>Loading your order…</p></div>
  <section id="page" hidden>
    <div class="card">
      <span class="pill" id="status"></span>
      <h1 id="headline" style="margin-top:10px"></h1>
      <p id="lead" class="muted" style="margin:6px 0 0"></p>
      <ol class="steps" id="steps"></ol>
    </div>
    <div class="card preview" id="previewCard" hidden>
      <h2>Your model</h2>
      <img id="previewImg" alt="Your TrackMade model">
      <div class="note" id="previewNote" hidden></div>
      <div id="decide" hidden>
        <p class="muted" id="autoNote"></p>
        <div class="btns"><button class="primary" id="approve">Looks great, make it</button><button class="ghost" id="changesBtn">Request a change</button></div>
        <div id="changesBox" hidden>
          <textarea id="changes" maxlength="1500" placeholder="What would you like changed? For example: crop in a little on the left, rename stop 3, change the date line."></textarea>
          <div class="btns"><button class="ghost" id="sendChanges">Send my changes</button></div>
        </div>
      </div>
    </div>
    <div class="card" id="shipCard" hidden>
      <h2>On its way</h2>
      <p>Tracking number <b id="tracking"></b></p>
      <a class="btn primary" id="trackLink" target="_blank" rel="noopener">Track your parcel</a>
    </div>
    <div class="card">
      <h2>Order details</h2>
      <dl id="details"></dl>
      <p class="muted" style="margin:14px 0 0">Questions? Reply to any of our emails.</p>
    </div>
  </section>
</main>
<script>
(()=>{const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=new URLSearchParams(location.search),ref=location.pathname.split('/').pop(),t=q.get('t')||'';
$('ref').textContent=ref;
const STEPS=[['paid','Order paid'],['preview','Order confirmation sent to you'],['approved','You approve your model'],['making','Being made'],['shipped','Shipped']];
const STAGE={pending_payment:-1,new:1,preview_sent:2,changes_requested:1,approved:3,printing:3,packed:3,shipped:5,delivered:5,request:0};
const TEXT={
 pending_payment:['Confirming your payment…','This takes a few seconds.'],
 request:['We’ve got your idea','We’ll reply by email within 2 days with a 3D preview and a price.'],
 new:['Thanks, your order is in','Within 2 days we’ll send your order confirmation with the final 3D model to approve.'],
 preview_sent:['Your model is ready to check','Look over the crop, stops and lettering, then approve it or ask for a change.'],
 changes_requested:['We’re making your changes','We’ll send an updated model to approve shortly.'],
 approved:['Approved, thank you','Your model will be made and shipped within 14 days.'],
 printing:['Your model is being made','Made to order in Australia. We’ll email the tracking number when it ships.'],
 packed:['Packed and ready to post','It goes to Australia Post next.'],
 shipped:['It’s on its way','Packed in foam and with Australia Post.'],
 delivered:['Delivered','We hope you love it. Tag @trackmade.co, we’d love to see it.'],
 cancelled:['Order cancelled','If this is a surprise, reply to any of our emails.']};
let polls=0;
async function load(){
  let o;
  try{const r=await fetch(`/api/order?a=view&ref=${encodeURIComponent(ref)}&t=${encodeURIComponent(t)}`);o=await r.json();if(!r.ok)throw new Error(o.error)}
  catch(e){$('loading').innerHTML=`<p>${esc(e.message||'We couldn’t load that order.')}</p>`;return}
  render(o);
  if(o.status==='pending_payment'&&polls++<20)setTimeout(load,2000);
}
function render(o){
  $('loading').hidden=true;$('page').hidden=false;
  const [h,l]=TEXT[o.status]||[o.statusLabel,''];$('headline').textContent=h;$('lead').textContent=l;
  const you=o.status==='preview_sent';$('status').textContent=you?'Waiting for you':o.statusLabel;$('status').className='pill'+(you?' you':'');
  const st=STAGE[o.status]??0;
  $('steps').hidden=o.status==='request'||o.status==='cancelled';
  $('steps').innerHTML=STEPS.map(([k,n],i)=>{const cls=i<st?'done':(i===st?'now':'');return`<li class="${cls}"><i>${i<st?'✓':i+1}</i>${n}</li>`}).join('');
  if(o.preview_url){$('previewCard').hidden=false;$('previewImg').src=o.preview_url;
    $('previewNote').hidden=!o.preview_note;$('previewNote').textContent=o.preview_note||''}
  $('decide').hidden=o.status!=='preview_sent';
  if(o.auto_approve_at)$('autoNote').textContent='No reply by '+new Date(o.auto_approve_at).toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'})+' and we’ll go ahead and make it as shown.';
  $('shipCard').hidden=!o.tracking_number;
  if(o.tracking_number){$('tracking').textContent=o.tracking_number;$('trackLink').href='https://auspost.com.au/mypost/track/details/'+encodeURIComponent(o.tracking_number)}
  $('details').innerHTML=[['Order',o.ref],['Model',o.size],['Title',o.title],['Details',o.subtitle],['Lettering',o.font]].filter(r=>r[1]&&r[1]!=='custom').map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('');
  if(q.get('paid')&&o.status!=='pending_payment'){banner('Payment received. Thank you! A receipt is on its way to your inbox.')}
  if(q.get('do')==='approve'&&o.status==='preview_sent')$('decide').scrollIntoView({block:'center'});
  if(q.get('do')==='changes'&&o.status==='preview_sent'){$('changesBox').hidden=false;$('changes').focus()}
}
function banner(t,err){const b=$('banner');b.hidden=false;b.className='msg'+(err?' err':'');b.textContent=t}
async function respond(action,note){
  ['approve','changesBtn','sendChanges'].forEach(i=>$(i).disabled=true);
  try{const r=await fetch('/api/order?a=respond',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ref,t,action,note})});
    const o=await r.json();if(!r.ok)throw new Error(o.error);
    banner(action==='approve'?'Thanks! We’ll start making your model.':'Got it. We’ll send an updated model to approve.');render(o);window.scrollTo({top:0,behavior:'smooth'})}
  catch(e){banner(e.message||'That didn’t go through. Try again.',true)}
  finally{['approve','changesBtn','sendChanges'].forEach(i=>$(i).disabled=false)}
}
$('approve').onclick=()=>respond('approve','');
$('changesBtn').onclick=()=>{$('changesBox').hidden=false;$('changes').focus()};
$('sendChanges').onclick=()=>{const n=$('changes').value.trim();if(n.length<3){banner('Tell us what you’d like changed.',true);return}respond('changes',n)};
load();
})();
</script>
</html>
